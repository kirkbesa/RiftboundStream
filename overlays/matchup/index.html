<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Matchup Overlay</title>
  <link rel="stylesheet" href="/overlays/theme.css" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 1920px;
      height: 1080px;
      overflow: hidden;
      background: transparent;
      font-family: 'Segoe UI', system-ui, sans-serif;
      color: #fff;
    }

    #frame { position: absolute; inset: 0; }

    /* The whole overlay fades as one unit when matchupVisible flips. */
    #frame {
      opacity: 0;
      transition: opacity 0.4s ease;
    }
    #frame.visible { opacity: 1; }

    /* ── Side rails ─────────────────────────────────────────────── */
    .rail {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 340px;
      padding: 22px 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      background: linear-gradient(180deg, rgba(6,14,28,0.94) 0%, rgba(6,14,28,0.74) 100%);
    }
    .rail.left  { left: 0;  border-right: 3px solid transparent; border-image: var(--brand-gradient) 1; }
    .rail.right { right: 0; border-left:  3px solid transparent; border-image: var(--brand-gradient-blue) 1; }

    /* Player accent — driven per side from the legend's domain colour, with
       the brand's gold (P1) / blue (P2) until a Legend is set. */
    .rail.left  { --side: var(--p1, var(--brand-p1)); }
    .rail.right { --side: var(--p2, var(--brand-p2)); }

    /* ── Name banner ────────────────────────────────────────────── */
    /* Bare text on the rail, centred over the champion box — same on both
       sides. Handle / pronouns sit on a line under the name. */
    .name-banner {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      padding: 4px 8px 0;
      text-align: center;
    }
    .player-name {
      max-width: 100%;
      font-size: 22px;
      font-weight: 800;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      text-shadow: 0 2px 6px rgba(0,0,0,0.6);
    }
    .player-meta {
      font-size: 12px;
      color: rgba(255,255,255,0.55);
      white-space: nowrap;
    }

    /* ── Champion (legend + unit + art) ─────────────────────────
       The whole box is card art, cropped to the character's face, with the
       Legend and Champion names on a scrim along the bottom.

       Riftcodex serves only the full card image (no art-only crop), so the
       crop is done here. Riftbound art is
       full-bleed, but the frame's cost / might / domain icons sit in the top
       corners and down the left edge — zooming the card to --champ-zoom of the
       box width pushes those out of frame. --champ-y then slides the window
       down the card: at 160% / 16% the box shows roughly 12%–37% of the card's
       height, which puts the face in the upper third of the box — clear of the
       name scrim — with a little headroom above it. Art varies card to card;
       these two values are the knobs. */
    .champ {
      --champ-zoom: 160%;
      --champ-y: 16%;
      position: relative;
      height: 176px;
      border-radius: 10px;
      overflow: hidden;
      background: var(--brand-navy);
      border: 1px solid rgba(255,255,255,0.1);
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
    }
    .champ-art {
      position: absolute; inset: 0;
      background-size: var(--champ-zoom) auto;
      background-position: center var(--champ-y);
      background-repeat: no-repeat;
    }
    .champ-scrim {
      position: absolute; inset: 0;
      background: linear-gradient(180deg, rgba(0,0,0,0) 38%, rgba(0,0,0,0.55) 62%, rgba(0,0,0,0.9) 100%);
    }
    .champ-text {
      position: relative;
      padding: 0 12px 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      text-align: center;
      text-transform: uppercase;
      text-shadow: 0 2px 6px rgba(0,0,0,0.8);
    }
    .champ-legend, .champ-unit {
      max-width: 100%;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      line-height: 1.15;
    }
    .champ-legend { font-size: 17px; font-weight: 800; letter-spacing: 0.5px; }
    .champ-unit   { font-size: 14px; font-weight: 700; letter-spacing: 0.4px; color: rgba(255,255,255,0.85); }

    /* ── Player video slot ──────────────────────────────────────
       Interior stays transparent so an OBS video source placed behind
       this overlay shows through the cut-out. The border + label just
       mark where to line the camera up. */
    .video-slot {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 10;
      border-radius: 10px;
      border: 2px solid rgba(255,255,255,0.12);
      box-shadow: inset 0 0 0 2px rgba(0,0,0,0.35);
      background: transparent;
    }
    /* Player cams switched off: the slots go and everything below moves up. */
    #frame.no-cams .video-slot { display: none; }
    .video-slot::after {
      content: attr(data-label);
      position: absolute;
      left: 8px; bottom: 6px;
      font-size: 9px; letter-spacing: 1.5px; text-transform: uppercase;
      color: rgba(255,255,255,0.28);
    }

    /* ── Battlefield ──────────────────────────────────────────────
       The whole card, uncropped — its printed name and rules text are part of
       what viewers read — with a name + Bo3 bar underneath, so nothing of ours
       is drawn over the card. Battlefields are landscape (1038×744); the box
       takes that ratio so the card fills it edge to edge. */
    .bf {
      border-radius: 10px;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,0.1);
      background: rgba(0,0,0,0.55);
      flex-shrink: 0;
    }
    .bf-art {
      aspect-ratio: 1038 / 744;
      background-color: var(--brand-navy);
      background-size: contain;
      background-position: center;
      background-repeat: no-repeat;
    }
    .bf-foot {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 12px;
      gap: 8px;
      border-top: 2px solid var(--side);
    }
    .rail.right .bf-foot { flex-direction: row-reverse; }
    .bf-name {
      font-size: 15px; font-weight: 800; letter-spacing: 0.5px;
      text-transform: uppercase;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    /* Two circles = Bo3 game wins. */
    .game-pips { display: flex; gap: 6px; flex-shrink: 0; }
    .game-pip {
      width: 16px; height: 16px; border-radius: 50%;
      border: 2px solid rgba(255,255,255,0.5);
      background: rgba(0,0,0,0.4);
      transition: background 0.25s ease, box-shadow 0.25s ease;
    }
    .game-pip.on {
      background: var(--side);
      border-color: var(--side);
      box-shadow: 0 0 10px var(--side);
    }

    /* ── Card showcase ────────────────────────────────────────────
       Fills everything from the battlefield down to the bottom of the rail.
       The card is as large as that space allows in whichever direction runs
       out first — height with player cams on, width with them off — centred,
       and never distorted (the card image is far larger than the space). */
    .showcase {
      flex: 1;
      min-height: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .showcase-card {
      max-width: 100%;
      max-height: 100%;
      border-radius: 12px;
      box-shadow: 0 10px 34px rgba(0,0,0,0.7), 0 0 0 1px rgba(255,255,255,0.08);
      display: none;
    }
    .showcase-card.visible { display: block; }

    /* ── Top-center score: race to 8 ────────────────────────────── */
    #score {
      position: absolute;
      top: 14px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 8px 14px;
      background: var(--brand-panel);
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.1);
      box-shadow: 0 6px 24px rgba(0,0,0,0.55);
    }
    .pip {
      width: 30px; height: 30px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 14px; font-weight: 800;
      color: rgba(255,255,255,0.55);
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.12);
      transition: all 0.25s ease;
    }
    .pip.center { width: 38px; height: 38px; font-size: 18px; }
    /* Filled up to a player's current points, from their own end. */
    .pip.p1-on { background: var(--p1, var(--brand-p1)); color: var(--brand-ink); border-color: var(--p1, var(--brand-p1)); }
    .pip.p2-on { background: var(--p2, var(--brand-p2)); color: #fff;             border-color: var(--p2, var(--brand-p2)); }
    .pip.center.goal { box-shadow: 0 0 16px rgba(255,255,255,0.5); color: #fff; background: rgba(255,255,255,0.14); }
    .pip.center.won-p1 { background: var(--p1, var(--brand-p1)); color: var(--brand-ink); }
    .pip.center.won-p2 { background: var(--p2, var(--brand-p2)); color: #fff; }
  </style>
</head>
<body>
  <div id="frame">

    <!-- Top-center race-to-8 -->
    <div id="score"></div>

    <!-- Left rail — Player 1 -->
    <div class="rail left" id="rail-p1">
      <div class="name-banner">
        <div class="player-name" id="p1-name">Player 1</div>
        <div class="player-meta" id="p1-meta"></div>
      </div>
      <div class="champ">
        <div class="champ-art" id="p1-champ-art"></div>
        <div class="champ-scrim"></div>
        <div class="champ-text">
          <div class="champ-legend" id="p1-legend">—</div>
          <div class="champ-unit"   id="p1-unit"></div>
        </div>
      </div>
      <div class="video-slot" data-label="P1 Cam"></div>
      <div class="bf">
        <div class="bf-art" id="p1-bf-art"></div>
        <div class="bf-foot">
          <div class="bf-name" id="p1-bf-name">Battlefield</div>
          <div class="game-pips" id="p1-pips"></div>
        </div>
      </div>
      <div class="showcase">
        <img class="showcase-card" id="p1-showcase" alt="" />
      </div>
    </div>

    <!-- Right rail — Player 2 -->
    <div class="rail right" id="rail-p2">
      <div class="name-banner">
        <div class="player-name" id="p2-name">Player 2</div>
        <div class="player-meta" id="p2-meta"></div>
      </div>
      <div class="champ">
        <div class="champ-art" id="p2-champ-art"></div>
        <div class="champ-scrim"></div>
        <div class="champ-text">
          <div class="champ-legend" id="p2-legend">—</div>
          <div class="champ-unit"   id="p2-unit"></div>
        </div>
      </div>
      <div class="video-slot" data-label="P2 Cam"></div>
      <div class="bf">
        <div class="bf-art" id="p2-bf-art"></div>
        <div class="bf-foot">
          <div class="bf-name" id="p2-bf-name">Battlefield</div>
          <div class="game-pips" id="p2-pips"></div>
        </div>
      </div>
      <div class="showcase">
        <img class="showcase-card" id="p2-showcase" alt="" />
      </div>
    </div>

  </div>

  <script src="/overlays/ws.js"></script>
  <script>
    const POINTS_TO_WIN = 8
    const GAMES_TO_WIN  = 2

    const frame = document.getElementById('frame')

    function getActive(state) {
      return state.matches?.[state.activeMatchIndex ?? 0] ?? null
    }

    function setBg(el, card) {
      el.style.backgroundImage = card?.imageUrl ? `url("${card.imageUrl}")` : 'none'
    }

    // Riftcodex names cards "Rengar - Pridestalker"; printed cards (and the
    // broadcast) read "Rengar, Pridestalker".
    const displayName = (name) => String(name ?? '').replace(/\s+[-–—]\s+/, ', ')

    // Long Legend names ("Azir, Emperor of the Sands") shrink to fit the box on
    // one line instead of being cut off — down to 70% of the CSS size, past
    // which the ellipsis takes over.
    function fitText(el) {
      el.style.fontSize = ''
      const base = parseFloat(getComputedStyle(el).fontSize)
      for (let size = base; el.scrollWidth > el.clientWidth && size > base * 0.7; size -= 0.5) {
        el.style.fontSize = `${size}px`
      }
    }

    function setPlayer(prefix, p) {
      document.getElementById(`${prefix}-name`).textContent = (p.name || 'TBD').toUpperCase()

      const meta = []
      if (p.handle)   meta.push(p.handle.startsWith('@') ? p.handle : '@' + p.handle)
      if (p.pronouns) meta.push(p.pronouns)
      document.getElementById(`${prefix}-meta`).textContent = meta.join(' · ')

      // Champion: the Legend's art fills the box (the unit's if no Legend is
      // set), with the Legend's name and the Champion Unit's name under it.
      const legend = p.legend ?? null
      const unit   = p.champion ?? null
      const legendEl = document.getElementById(`${prefix}-legend`)
      const unitEl   = document.getElementById(`${prefix}-unit`)
      legendEl.textContent = displayName(legend?.name) || p.deckName || '—'
      unitEl.textContent   = displayName(unit?.name)
      fitText(legendEl)
      fitText(unitEl)
      setBg(document.getElementById(`${prefix}-champ-art`), legend ?? unit)

      // Battlefield
      const bf = p.battlefield ?? null
      document.getElementById(`${prefix}-bf-name`).textContent = bf?.name || 'Battlefield'
      setBg(document.getElementById(`${prefix}-bf-art`), bf)

      // Game pips (Bo3)
      const pips = document.getElementById(`${prefix}-pips`)
      pips.innerHTML = ''
      const won = Math.max(0, Math.min(GAMES_TO_WIN, p.gameScore ?? 0))
      for (let i = 0; i < GAMES_TO_WIN; i++) {
        const el = document.createElement('div')
        el.className = 'game-pip' + (i < won ? ' on' : '')
        pips.appendChild(el)
      }

      // Showcase
      const sc = document.getElementById(`${prefix}-showcase`)
      if (p.showcase?.imageUrl) {
        sc.src = p.showcase.imageUrl
        sc.classList.add('visible')
      } else {
        sc.classList.remove('visible')
        sc.removeAttribute('src')
      }

      // Per-side accent from the legend's domain colour.
      const accent = legend?.domainColor || unit?.domainColor || null
      if (accent) frame.style.setProperty(prefix === 'p1' ? '--p1' : '--p2', accent)
    }

    // Race-to-8 track: 1..7 (P1 fills from left) · 8 (goal) · 7..1 (P2 fills from right)
    function renderScore(p1, p2) {
      const score = document.getElementById('score')
      score.innerHTML = ''

      const pt1 = Math.max(0, Math.min(POINTS_TO_WIN, p1.points ?? 0))
      const pt2 = Math.max(0, Math.min(POINTS_TO_WIN, p2.points ?? 0))

      // left side values 1..7 — filled up to P1's points
      for (let v = 1; v <= POINTS_TO_WIN - 1; v++) {
        const el = document.createElement('div')
        el.className = 'pip' + (v <= pt1 ? ' p1-on' : '')
        el.textContent = v
        score.appendChild(el)
      }
      // center 8 — the goal; lights in a player's colour when they reach it
      const c = document.createElement('div')
      c.className = 'pip center goal'
      if (pt1 >= POINTS_TO_WIN) c.className = 'pip center won-p1'
      else if (pt2 >= POINTS_TO_WIN) c.className = 'pip center won-p2'
      c.textContent = POINTS_TO_WIN
      score.appendChild(c)
      // right side values 7..1 — filled up to P2's points
      for (let v = POINTS_TO_WIN - 1; v >= 1; v--) {
        const el = document.createElement('div')
        el.className = 'pip' + (v <= pt2 ? ' p2-on' : '')
        el.textContent = v
        score.appendChild(el)
      }
    }

    function render(state) {
      const active = getActive(state)
      if (!active) return
      const overlay = state.overlay ?? {}

      frame.classList.toggle('visible', overlay.matchupVisible !== false)
      frame.classList.toggle('no-cams', overlay.playerCamsVisible === false)
      if (overlay.matchupVisible === false) return

      const [p1, p2] = active.players
      setPlayer('p1', p1)
      setPlayer('p2', p2)
      renderScore(p1, p2)
    }

    connectOverlay(msg => { if (msg.type === 'state') render(msg.data) })
  </script>
</body>
</html>
